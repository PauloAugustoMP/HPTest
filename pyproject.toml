[project]
name = "gpu-assistant"
version = "0.1.0"
description = "Conversational assistant to query shared-GPU infrastructure (LangGraph + llama.cpp)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain-core>=0.3,<1.0",
    "langchain-openai>=0.2,<1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "streamlit>=1.40",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Silence two deprecation warnings from langgraph/langchain internals (not our
# code): a pending-deprecation from the checkpoint serializer, and a moved
# AgentStatePydantic import. Scoped tightly (by category / message) so our own
# warnings still surface.
filterwarnings = [
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
    "ignore:AgentStatePydantic has been moved",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
